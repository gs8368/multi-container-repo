name: Deploy MultiDocker
on:
  push:
    branches:
      - main # check your repo, your default branch might be master!

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - run: docker build -t rallycoding/react-test -f ./client/Dockerfile.dev ./client
      - run: docker run -e CI=true rallycoding/react-test npm test

      - run: docker build -t rallycoding/multi-client -f ./client/Dockerfile.dev ./client
      - run: docker build -t rallycoding/multi-nginx -f ./nginx/Dockerfile.dev ./nginx
      - run: docker build -t rallycoding/multi-server -f ./server/Dockerfile.dev ./server
      - run: docker build -t rallycoding/multi-worker -f ./worker/Dockerfile.dev ./worker

      - run: docker push rallycoding/multi-client
      - run: docker push rallycoding/multi-nginx
      - run: docker push rallycoding/multi-server
      - run: docker push rallycoding/multi-worker

      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*'

      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v18
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: multi-docker
          environment_name: Multi-docker-env
          existing_bucket_name: elasticbeanstalk-ap-south-1-243490674618
          region: ap-south-1
          version_label: ${{ github.sha }}
          deployment_package: deploy.zip
