name: Deploy MultiDocker
on:
  push:
    branches:
      - main # check your repo, your default branch might be master!

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_REPO: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@v3
      - run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - run: docker build -t $DOCKER_REPO/react-test -f ./client/Dockerfile.dev ./client
      - run: docker run -e CI=true $DOCKER_REPO/react-test npm test

      - run: docker build -t $DOCKER_REPO/multi-client ./client
      - run: docker build -t $DOCKER_REPO/multi-nginx ./nginx
      - run: docker build -t $DOCKER_REPO/multi-server ./server
      - run: docker build -t $DOCKER_REPO/multi-worker ./worker

      - run: docker push $DOCKER_REPO/multi-client
      - run: docker push $DOCKER_REPO/multi-nginx
      - run: docker push $DOCKER_REPO/multi-server
      - run: docker push $DOCKER_REPO/multi-worker

      - name: Inject Docker repo into compose file
        run: sed -i "s|\${DOCKER_USERNAME}|$DOCKER_REPO|g" docker-compose.yml

      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*'

      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v18
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: multi-docker
          environment_name: Multi-docker-env
          existing_bucket_name: elasticbeanstalk-ap-south-1-243490674618
          region: ap-south-1
          version_label: ${{ github.sha }}
          deployment_package: deploy.zip
