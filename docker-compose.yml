version: '3'
services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    mem_limit: 128m
    hostname: client
  api:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    mem_limit: 128m
    hostname: api
    environment:
      - REDIS_HOST=$REDIS_HOST
      - REDIS_PORT=$REDIS_PORT
      - PGUSER=$PGUSER
      - PGHOST=$PGHOST
      - PGDATABASE=$PGDATABASE
      - PGPASSWORD=$PGPASSWORD
      - PGPORT=$PGPORT
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.dev
    mem_limit: 128m
    hostname: worker
    environment:
      - REDIS_HOST=$REDIS_HOST
      - REDIS_PORT=$REDIS_PORT
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.dev
    mem_limit: 128m
    hostname: nginx
    ports:
      - '80:80'
